services:
  - type: web
    name: hill-b
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    routes:
      # Spotify sends the login back to /callback; the app itself finishes it.
      - type: rewrite
        source: /callback
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /index.html
        name: Cache-Control
        value: no-cache
