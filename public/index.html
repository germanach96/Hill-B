  <div class="app" id="app">
    <header class="bar">
      <span class="brand"><svg class="brand-mark" aria-hidden="true"><use href="#i-mark"/></svg>Hill-B</span>
    </header>

    <!-- Session: how long, then the albums -->
    <section class="view view-session" id="view-session" aria-labelledby="session-title" hidden>
      <h1 class="sr-only" id="session-title">Elige tu salida</h1>

      <div class="segmented" role="radiogroup" aria-label="Medir la salida por">
        <span class="segmented-thumb" aria-hidden="true"></span>
        <button type="button" role="radio" class="segment" data-mode="time" aria-checked="true">Tiempo</button>
        <button type="button" role="radio" class="segment" data-mode="distance" aria-checked="false">Distancia</button>
      </div>

      <!-- Two vertical wheels: hours : minutes, or km , hundreds of metres. Swipe up and down. -->
      <div class="picker" id="picker">
        <div class="wheel" id="wheel-major" tabindex="0" role="spinbutton"></div>
        <span class="picker-sep" id="picker-sep" aria-hidden="true">:</span>
        <div class="wheel" id="wheel-minor" tabindex="0" role="spinbutton"></div>
      </div>
      <p class="picker-unit" id="picker-unit" aria-hidden="true">horas y minutos</p>

      <!-- Intensity is the pace, swiped left and right. Only distance needs it. -->
      <div class="intensity" id="intensity" hidden>
        <div class="intensity-head">
          <span class="intensity-label" id="intensity-label">Intensidad</span>
          <span class="intensity-total" id="intensity-total">54:45 de carrera</span>
        </div>
        <div class="strip" id="pace-wheel" tabindex="0" role="spinbutton" aria-labelledby="intensity-label"></div>
      </div>

      <p class="library" id="library" aria-live="polite"></p>

      <div class="dock">
        <button class="btn btn-start" id="find" type="button">Start</button>
      </div>
    </section>

    <!-- Results: five albums to swipe through -->
    <section class="view view-results" id="view-results" aria-labelledby="results-title" hidden>
      <div class="results-head">
        <button type="button" class="back" id="back" aria-label="Cambiar la sesión"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
        <div>
          <h1 class="results-title" id="results-title">Para 45 min</h1>
          <p class="results-sub" id="results-sub" aria-live="polite"></p>
        </div>
        <button type="button" class="reroll" id="reroll" hidden><svg aria-hidden="true"><use href="#i-shuffle"/></svg><span class="reroll-label">Otros 5</span></button>
      </div>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
      <ul class="deck" id="deck" aria-label="Discos propuestos"></ul>
      <div class="state" id="results-state" hidden></div>
    </section>
  </div>
</body>
</html>
