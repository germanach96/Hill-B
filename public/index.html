<!doctype html>
<html lang="es" data-view="boot">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Hill-B</title>
  <meta name="description" content="El disco entero que te dura toda la salida a correr, sacado de tu playlist.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hill-B">
  <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <!-- Icons: Phosphor Icons (bold, MIT) and Simple Icons (Spotify mark, CC0). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 256 256"><path fill="currentColor" d="M228,128a12,12,0,0,1-12,12H140v76a12,12,0,0,1-24,0V140H40a12,12,0,0,1,0-24h76V40a12,12,0,0,1,24,0v76h76A12,12,0,0,1,228,128Z"/></symbol>
    <symbol id="i-minus" viewBox="0 0 256 256"><path fill="currentColor" d="M228,128a12,12,0,0,1-12,12H40a12,12,0,0,1,0-24H216A12,12,0,0,1,228,128Z"/></symbol>
    <symbol id="i-back" viewBox="0 0 256 256"><path fill="currentColor" d="M228,128a12,12,0,0,1-12,12H69l51.52,51.51a12,12,0,0,1-17,17l-72-72a12,12,0,0,1,0-17l72-72a12,12,0,0,1,17,17L69,116H216A12,12,0,0,1,228,128Z"/></symbol>
    <symbol id="i-out" viewBox="0 0 256 256"><path fill="currentColor" d="M204,64V168a12,12,0,0,1-24,0V93L72.49,200.49a12,12,0,0,1-17-17L163,76H88a12,12,0,0,1,0-24H192A12,12,0,0,1,204,64Z"/></symbol>
    <symbol id="i-spotify" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></symbol>
    <symbol id="i-mark" viewBox="0 0 32 17.4"><path fill="currentColor" d="M23.1 17.4H0L5.4 9.7Q6.5 8.1 7.9 6.9Q9.2 5.8 10.7 5.1Q12.2 4.5 13.6 4.5Q14.8 4.5 15.4 4.9Q16.1 5.3 16.2 5.9Q16.4 6.6 16.2 7.4H16.3Q19.4 3.2 20.9 2.2Q22.4 1.2 24.1 0.6Q25.8 0 27.8 0Q30.5 0 31.4 1Q32.4 2 31.8 3.9Q31.2 5.8 29.3 8.5ZM22.9 13.6 26.2 8.9Q27.5 7 27.2 6.2Q26.9 5.3 24.9 5.3Q23.8 5.3 22.7 5.7Q21.6 6 20.6 6.8Q19.7 7.6 18.7 8.9L15.4 13.6ZM10.6 13.6 12.8 10.5Q13.3 9.8 13.3 9.3Q13.3 8.8 12.9 8.6Q12.5 8.4 11.7 8.4Q10.7 8.4 9.7 8.9Q8.7 9.4 8.1 10.4L5.9 13.6Z"/></symbol>
  </svg>

  <div class="app" id="app">
    <header class="bar">
      <span class="brand"><svg class="brand-mark" aria-hidden="true"><use href="#i-mark"/></svg>Hill-B</span>
    </header>

    <!-- Session: how long, then the albums -->
    <section class="view view-session" id="view-session" aria-labelledby="session-title" hidden>
      <h1 class="session-title" id="session-title">¿Cuánto vas a correr?</h1>

      <div class="segmented" role="radiogroup" aria-label="Medir la sesión por">
        <span class="segmented-thumb" aria-hidden="true"></span>
        <button type="button" role="radio" class="segment" data-mode="time" aria-checked="true">Tiempo</button>
        <button type="button" role="radio" class="segment" data-mode="distance" aria-checked="false">Distancia</button>
      </div>

      <div class="dial">
        <button type="button" class="step" id="less" aria-label="Menos"><svg aria-hidden="true"><use href="#i-minus"/></svg></button>
        <div class="dial-value">
          <label class="sr-only" for="amount" id="amount-label">Minutos</label>
          <input class="amount" id="amount" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" value="45">
          <span class="unit" id="unit" aria-hidden="true">minutos</span>
        </div>
        <button type="button" class="step" id="more" aria-label="Más"><svg aria-hidden="true"><use href="#i-plus"/></svg></button>
      </div>

      <div class="presets" id="presets" role="group" aria-label="Sesiones habituales"></div>

      <div class="pace" id="pace" hidden>
        <span class="pace-label" id="pace-label">Ritmo</span>
        <div class="pace-control">
          <button type="button" class="step step-small" id="pace-less" aria-label="Ritmo más rápido"><svg aria-hidden="true"><use href="#i-minus"/></svg></button>
          <output class="pace-value" id="pace-value" aria-labelledby="pace-label">5:30</output>
          <button type="button" class="step step-small" id="pace-more" aria-label="Ritmo más lento"><svg aria-hidden="true"><use href="#i-plus"/></svg></button>
        </div>
        <span class="pace-total" id="pace-total">55:00 de carrera</span>
      </div>

      <p class="library" id="library" aria-live="polite"></p>

      <div class="dock">
        <button class="btn btn-volt" id="find" type="button">Buscar discos</button>
      </div>
    </section>

    <!-- Results: five albums to swipe through -->
    <section class="view view-results" id="view-results" aria-labelledby="results-title" hidden>
      <div class="results-head">
        <button type="button" class="back" id="back" aria-label="Cambiar la sesión"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
        <div>
          <h1 class="results-title" id="results-title">Para 45 min</h1>
          <p class="results-sub" id="results-sub"></p>
        </div>
      </div>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
      <ul class="deck" id="deck" aria-label="Discos propuestos"></ul>
      <div class="state" id="results-state" hidden></div>
    </section>
  </div>
</body>
</html>
